<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="cyan-glow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.4px;
    }
  </style>

  <!-- Main Container Card -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#bg-grad)" stroke="url(#card-border)" stroke-width="1.5"/>
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#grid-pattern)"/>

  <!-- Ambient Glow Spots -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#cyan-glow)"/>
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#purple-glow)"/>

  <!-- Status Pill (Top Left) -->
  <g transform="translate(36, 26)">
    <rect width="260" height="26" rx="13" fill="#0E192B" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#10B981"/>
    <circle cx="16" cy="13" r="8" fill="#10B981" fill-opacity="0.25"/>
    <text x="32" y="17" fill="#34D399" class="badge-text" font-size="11">OPEN TO INNOVATION &amp; ROLES</text>
  </g>

  <!-- Handle Pill (Top Right) -->
  <g transform="translate(730, 26)">
    <rect width="134" height="26" rx="13" fill="#111827" stroke="#1E293B" stroke-width="1"/>
    <text x="67" y="17" fill="#94A3B8" class="mono-text" font-size="12" text-anchor="middle">@YtterStick</text>
  </g>

  <!-- Name / Title Section -->
  <text x="36" y="98" fill="#F8FAFC" class="title-text" font-size="34">
    ANDREI DILAG
    <tspan fill="url(#accent-cyan)" font-size="28" font-weight="700"> /</tspan>
    <tspan fill="#64748B" font-size="20" font-weight="500"> ytter-dev</tspan>
  </text>

  <!-- Subtitle with highlight -->
  <text x="36" y="128" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    <tspan fill="#38BDF8" font-weight="600">Full-Stack Architect</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#C084FC" font-weight="600">GenAI &amp; LLM Solutions</tspan>
    <tspan fill="#475569"> • </tspan>
    <tspan fill="#F59E0B" font-weight="600">Mobile Hackathon Champion</tspan>
  </text>

  <!-- Bio Quote / Mission -->
  <text x="36" y="156" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-style="italic">
    "Engineering end-to-end enterprise systems, intelligent agentic workflows, and high-performance applications."
  </text>

  <!-- Highlight Badges Row -->
  <g transform="translate(36, 185)">
    <!-- Badge 1: Academic & Faculty -->
    <g transform="translate(0, 0)">
      <rect width="250" height="36" rx="8" fill="#0D1626" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="18" r="8" fill="#38BDF8" fill-opacity="0.15"/>
      <text x="20" y="22" fill="#38BDF8" font-size="12" text-anchor="middle">🎓</text>
      <text x="38" y="22" fill="#E2E8F0" class="badge-text" font-size="11.5">IT Faculty Teacher</text>
      <text x="144" y="22" fill="#64748B" font-size="11">@ STI Fairview</text>
    </g>

    <!-- Badge 2: Industry AI/NLP Experience -->
    <g transform="translate(260, 0)">
      <rect width="275" height="36" rx="8" fill="#13122B" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="18" r="8" fill="#A855F7" fill-opacity="0.15"/>
      <text x="20" y="22" fill="#C084FC" font-size="12" text-anchor="middle">🤖</text>
      <text x="38" y="22" fill="#E2E8F0" class="badge-text" font-size="11.5">Software Dev Intern (NLP)</text>
      <text x="195" y="22" fill="#64748B" font-size="11">@ 3 AM Digital</text>
    </g>

    <!-- Badge 3: Codefest Champions -->
    <g transform="translate(545, 0)">
      <rect width="318" height="36" rx="8" fill="#1C180E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="18" r="8" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="20" y="22" fill="#FBBF24" font-size="12" text-anchor="middle">🏆</text>
      <text x="38" y="22" fill="#FBBF24" class="badge-text" font-size="11.5">Codefest Cluster &amp; Local Champion</text>
      <text x="245" y="22" fill="#78716C" font-size="10.5">| Nat'l Finalist</text>
    </g>
  </g>

  <!-- Interactive Terminal Mini-Pill (Bottom Bar) -->
  <g transform="translate(36, 237)">
    <text x="0" y="16" fill="#38BDF8" class="mono-text" font-size="12" font-weight="600">&gt; stack:</text>
    <text x="65" y="16" fill="#94A3B8" class="mono-text" font-size="12">Spring Boot • React (Vite) • Next.js • GenAI/LLM • Android Studio • Docker • MongoDB</text>
  </g>
</svg>
