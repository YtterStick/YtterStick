<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 192" width="720" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#30363D" fill-opacity="0.6"/>
    </pattern>
    <style>
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="718" height="190" rx="12" fill="url(#bg)" stroke="#30363D" stroke-width="1.5"/>
  <rect x="1" y="1" width="718" height="190" rx="12" fill="url(#dots)"/>

  <!-- Top Accent Line -->
  <rect x="24" y="1" width="672" height="2.5" rx="1.25" fill="url(#accent)" fill-opacity="0.85"/>

  <!-- Subtle Right Architectural Node Motif -->
  <g opacity="0.22" stroke="#58A6FF" stroke-width="1.2" fill="none">
    <line x1="590" y1="68" x2="650" y2="96"/>
    <line x1="650" y1="96" x2="612" y2="142"/>
    <line x1="650" y1="96" x2="686" y2="62"/>
    <circle cx="590" cy="68" r="4" fill="#58A6FF"/>
    <circle cx="650" cy="96" r="5" fill="#3FB950" stroke="#3FB950"/>
    <circle cx="612" cy="142" r="3.5" fill="#A371F7" stroke="#A371F7"/>
    <circle cx="686" cy="62" r="3" fill="#58A6FF"/>
  </g>

  <!-- Live Status Row -->
  <circle cx="38" cy="40" r="4.5" fill="#3FB950"/>
  <circle cx="38" cy="40" r="7" fill="#3FB950" fill-opacity="0.25">
    <animate attributeName="r" values="5;11;5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="44.5" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="600" letter-spacing="0.4">QUEZON CITY, PH · BUILDING &amp; TEACHING</text>
  <text x="688" y="44.5" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="500" text-anchor="end">@YtterStick</text>

  <!-- Name & Handle -->
  <text x="34" y="100" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.6">
    Andrei Dilag<tspan fill="#58A6FF" font-size="24" font-weight="500"> / ytter-dev</tspan><tspan class="blink" fill="#3FB950" font-size="26" font-weight="700">_</tspan>
  </text>

  <!-- Role Line -->
  <text x="34" y="135" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="19.5" font-weight="400">
    Full-Stack Engineer · GenAI &amp; NLP · IT Faculty Teacher
  </text>

  <!-- Highlight Footer Line -->
  <text x="34" y="166" fill="#8B949E" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="500">
    <tspan fill="#D29922">2x Codefest Champion</tspan>
    <tspan fill="#484F58"> · </tspan>
    <tspan fill="#58A6FF">Spring Boot &amp; React</tspan>
    <tspan fill="#484F58"> · </tspan>
    <tspan fill="#3FB950">Agentic AI</tspan>
  </text>
</svg>
